[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-humaniser-academic-engine"
version = "0.1.0"
description = "CLI-first academic writing refinement engine prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
flash = ["runpod-flash>=1.7.0"]
web = ["fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
academic-engine = "academic_engine.cli:main"
academic-engine-web = "academic_engine.web.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/academic_engine"]
